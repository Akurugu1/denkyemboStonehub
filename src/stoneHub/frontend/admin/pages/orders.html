<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>StoneHub - Orders</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>


    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside class="sidebar">

        <div class="sidebar-logo">

            <h2>StoneHub</h2>

            <span>Admin</span>

        </div>


        <nav class="sidebar-nav">

            <a
                href="../index.html"
                class="nav-item"
            >
                <span>📊</span>
                <span>Dashboard</span>
            </a>


            <a
                href="products.html"
                class="nav-item"
            >
                <span>📦</span>
                <span>Products</span>
            </a>


            <a
                href="orders.html"
                class="nav-item active"
            >
                <span>🛒</span>
                <span>Orders</span>
            </a>


            <a
                href="customers.html"
                class="nav-item"
            >
                <span>👥</span>
                <span>Customers</span>
            </a>


            <a
                href="review.html"
                class="nav-item"
            >
                <span>⭐</span>
                <span>Reviews</span>
            </a>


            <a
                href="payments.html"
                class="nav-item"
            >
                <span>💳</span>
                <span>Payments</span>
            </a>


            <a
                href="reports.html"
                class="nav-item"
            >
                <span>📈</span>
                <span>Reports</span>
            </a>


            <a
                href="settings.html"
                class="nav-item"
            >
                <span>⚙️</span>
                <span>Settings</span>
            </a>

        </nav>


        <div class="sidebar-bottom">

            <a
                href="#"
                class="nav-item"
            >
                <span>🚪</span>
                <span>Logout</span>
            </a>

        </div>

    </aside>



    <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->

    <main class="main-content">


        <!-- TOPBAR -->

        <header class="topbar">

            <div class="topbar-left">

                <button class="menu-button">
                    ☰
                </button>

                <h1>Orders</h1>

            </div>


            <div class="topbar-right">

                <div class="search-box">

                    <input
                        type="text"
                        id="orderSearch"
                        placeholder="Search orders..."
                    >

                </div>


                <button class="notification-button">
                    🔔
                </button>


                
                   <div id="adminProfile"></div> 

                   

                

            </div>

        </header>



        <!-- =================================================
             ORDERS CONTENT
             ================================================= -->

        <section class="dashboard">


            <!-- PAGE HEADER -->

            <div class="page-header">

                <div>

                    <h2>Orders</h2>

                    <p>
                        Manage and track customer orders.
                    </p>

                </div>

            </div>



            <!-- =================================================
                 ORDER FILTERS
                 ================================================= -->

            <div class="order-filters">

                <button
                    class="filter-button active"
                    data-status="All"
                >
                    All
                </button>


                <button
                    class="filter-button"
                    data-status="Pending"
                >
                    Pending
                </button>

                <button
                    class="filter-button"
                    data-status="Processing"
                >
                    Processing
                </button>


                <button
                    class="filter-button"
                    data-status="Delivered"
                >
                    Delivered
                </button>


                <button
                    class="filter-button"
                    data-status="Cancelled"
                >
                    Cancelled
                </button>

            </div>



            <!-- =================================================
                 ORDERS TABLE
                 ================================================= -->

            <div class="dashboard-card product-card">


                <div class="table-container">

                    <table class="orders-management-table">


                        <thead>

                            <tr>

                                <th>Order ID</th>

                                <th>Customer</th>

                                <th>Items</th>

                                <th>Total</th>

                                <th>Date</th>

                                <th>Status</th>

                                <th>Actions</th>

                            </tr>

                        </thead>


                        <tbody id="ordersManagementBody">

                        </tbody>


                    </table>

                </div>


            </div>

        </section>

    </main>



    <!-- =====================================================
         ORDER DETAILS MODAL
         ===================================================== -->

    <div
        class="modal"
        id="orderModal"
    >

        <div class="modal-content order-modal">


            <div class="modal-header">

                <h3>
                    Order Details
                </h3>


                <button
                    class="close-modal"
                    id="closeOrderModal"
                >
                    ×
                </button>

            </div>


            <div id="orderDetails">

            </div>


        </div>

    </div>



    <script src="../js/app.js"></script>
    <script src="../components/profile.js"></script>
    <script src="../js/orders.js"></script>

    <script>
        loadAdminProfile();
    </script>

</body>

</html>
