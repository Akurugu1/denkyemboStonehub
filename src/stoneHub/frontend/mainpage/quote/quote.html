<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Request a Quote | Denkyembo Marble & Granite</title>

    <!-- ==========================================================
         GOOGLE FONT
    =========================================================== -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">


    <!-- ==========================================================
         FONT AWESOME
    =========================================================== -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


    <!-- ==========================================================
         MAIN WEBSITE CSS
    =========================================================== -->

    <link rel="stylesheet"
          href="../denkyembo.css">


    <!-- ==========================================================
         QUOTE PAGE CSS
    =========================================================== -->

    <link rel="stylesheet"
          href="quote.css">

</head>


<body>


<!-- ==========================================================
     LOGO HEADER
========================================================== -->

<header class="site-header">

    <div class="header-container">

        <a href="../index.html"
           class="logo">

            <img src="../images/logo.png"
                 alt="Denkyembo Marble & Granite Logo">

        </a>

    </div>

</header>



<!-- ==========================================================
     STICKY NAVIGATION
========================================================== -->

<nav class="quote-navbar">

    <div class="quote-nav-wrapper">


        <!-- ======================================================
             NAVIGATION LINKS
        ======================================================= -->

        <ul class="quote-nav-links">

            <li>
                <a href="../index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="../index.html#collections">
                    Collections
                </a>
            </li>

            <li>
                <a href="../project/project.html">
                    Projects
                </a>
            </li>

            <li>
                <a href="../about/about.html">
                    About
                </a>
            </li>

            <li>
                <a href="../contact/contact.html">
                    Contact
                </a>
            </li>

        </ul>


        <!-- ======================================================
             NAVIGATION ACTIONS
        ======================================================= -->

        <div class="quote-nav-actions">


            <!-- ==================================================
                 CURRENCY
            =================================================== -->

            <select class="currency-switcher"
                    aria-label="Currency">

                <option value="GHS">
                    GHS
                </option>

                <option value="USD">
                    USD
                </option>

                <option value="EUR">
                    EUR
                </option>

            </select>


            <!-- ==================================================
                 ACCOUNT
            =================================================== -->

            <a href="../customerRegistration/account.html"
               class="nav-icon account-icon"
               aria-label="Account">

                <i class="fa-regular fa-user"></i>

            </a>


            <!-- ==================================================
                 DELIVERY
                 FAST TRUCK WITH SPEED DASHES
            =================================================== -->

            <a href="../cart/delivery/delivery.html"
               class="nav-icon delivery-icon"
               aria-label="Delivery">

                <i class="fa-solid fa-truck-fast"></i>

            </a>


            <!-- ==================================================
                 CART
            =================================================== -->

            <a href="../cart/cart.html"
               class="nav-icon cart-icon"
               aria-label="Shopping Cart">

                <i class="fa-solid fa-cart-shopping"></i>

                <span class="cart-badge">
                    0
                </span>

            </a>

        </div>

    </div>

</nav>



<!-- ==========================================================
     REQUEST QUOTE PAGE
========================================================== -->

<main class="quote-page">

    <div class="quote-container">


        <!-- ======================================================
             RETURN TO PRODUCT
        ======================================================= -->

        <button type="button"
                class="back-to-product"
                id="returnProductBtn">

            <i class="fa-solid fa-arrow-left"></i>

            <span>
                Return to Product Details
            </span>

        </button>



        <!-- ======================================================
             INTRODUCTION
        ======================================================= -->

        <section class="quote-intro">

            <span class="quote-label">
                REQUEST A QUOTE
            </span>

            <h1>
                Let us help bring
                your project to life.
            </h1>

            <p>
                Tell us what you are looking for and
                our team will get back to you with
                a personalised quotation.
            </p>

        </section>



        <!-- ======================================================
             QUOTE FORM
        ======================================================= -->

        <section class="quote-form-wrapper">

            <form id="quoteForm"
                  class="quote-form">


                <!-- ==================================================
                     PRODUCT
                =================================================== -->

                <div class="form-group">

                    <label for="product">
                        Product
                    </label>

                    <input type="text"
                           id="product"
                           name="product"
                           placeholder="Enter the stone product you are interested in">

                </div>



                <!-- ==================================================
                     FULL NAME
                =================================================== -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input type="text"
                           id="name"
                           name="name"
                           placeholder="Enter your full name"
                           required>

                </div>



                <!-- ==================================================
                     EMAIL
                =================================================== -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="Enter your email address"
                           required>

                </div>



                <!-- ==================================================
                     PHONE
                =================================================== -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input type="tel"
                           id="phone"
                           name="phone"
                           placeholder="Enter your phone number"
                           required>

                </div>



                <!-- ==================================================
                     QUANTITY
                =================================================== -->

                <div class="form-group">

                    <label for="quantity">
                        Quantity / Estimated Area
                    </label>

                    <input type="text"
                           id="quantity"
                           name="quantity"
                           placeholder="e.g. 10 slabs or 25 m²">

                </div>



                <!-- ==================================================
                     PROJECT DETAILS
                =================================================== -->

                <div class="form-group">

                    <label for="message">
                        Project Details
                    </label>

                    <textarea id="message"
                              name="message"
                              rows="6"
                              placeholder="Tell us about your project or any specific requirements..."></textarea>

                </div>



                <!-- ==================================================
                     SUBMIT
                =================================================== -->

                <button type="submit"
                        class="submit-quote-btn">

                    <span>
                        Submit Quote Request
                    </span>

                    <i class="fa-solid fa-arrow-right"></i>

                </button>

            </form>

        </section>

    </div>

</main>



<!-- ==========================================================
     JAVASCRIPT
========================================================== -->

<script src="quote.js"></script>

</body>

</html>
