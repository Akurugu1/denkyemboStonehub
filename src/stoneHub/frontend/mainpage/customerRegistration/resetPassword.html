<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>StoneHub - Reset Password</title>

   <link rel="stylesheet" href="auth.css">

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>StoneHub</h1>

            <h2>Reset Password</h2>

            <p class="welcome">
                Enter your new password below.
            </p>

            <form id="resetPasswordForm">

                <label for="newPassword">
                    New Password
                </label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                    required
                >

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                    required
                >

                <p
                    id="message"
                    class="error-message"
                ></p>

                <button type="submit">
                    Reset Password
                </button>

            </form>

            <a href="login.html">
                Back to Login
            </a>

        </div>

    </div>

    <script src="resetPassword.js"></script>

</body>

</html>
