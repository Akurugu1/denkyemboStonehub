<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart | Denkyembo</title>

    <!-- Google Font -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Cart CSS -->
    <link rel="stylesheet"
          href="cart.css">

</head>

<body>


<!-- ==========================================================
     HEADER
========================================================== -->

<header class="header">

    <div class="container header-container">

        <a href="../index.html"
           class="logo"
           aria-label="Denkyembo Marble and Granite Home">

            <img src="../images/logo.png"
                 alt="Denkyembo Logo">

        </a>

    </div>

</header>


<!-- ==========================================================
     NAVIGATION
========================================================== -->

<nav class="navbar">

    <div class="container nav-wrapper">

        <ul class="nav-links">

            <li>
                <a href="../index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="../index.html#collections">
                    Collections
                </a>
            </li>

            <li>
                <a href="../project/project.html">
                    Projects
                </a>
            </li>

            <li>
                <a href="../about/about.html">
                    About
                </a>
            </li>

            <li>
                <a href="../contact/contact.html">
                    Contact
                </a>
            </li>

        </ul>


        <div class="nav-actions">

            <!-- CURRENCY -->

            <select
                class="currency-switcher"
                aria-label="Currency">

                <option value="GHS">GHS</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>

            </select>


            <!-- ACCOUNT -->

            <a href="../customerRegistration/account.html"
               class="nav-icon account-icon"
               aria-label="Account">

                <i class="fa-regular fa-user"></i>

            </a>


            <!-- DELIVERY -->

            <a href="delivery/delivery.html"
               class="nav-icon delivery-icon"
               aria-label="Delivery and Tracking">

                <i class="fa-solid fa-truck-fast"></i>

            </a>


            <!-- CART -->

            <a href="cart.html"
               class="nav-icon cart-icon active"
               aria-label="Shopping Cart">

                <i class="fa-solid fa-cart-shopping"></i>

                <span class="cart-badge">
                    0
                </span>

            </a>

        </div>

    </div>

</nav>


<!-- ==========================================================
     CART
========================================================== -->

<main class="cart-page">

    <div class="container cart-container">

        <h1>

            <i class="fa-solid fa-cart-shopping"></i>

            Shopping Cart

        </h1>


        <!-- CART ITEMS -->

        <div id="cartItems">

            <p>
                Loading cart...
            </p>

        </div>


        <!-- CART SUMMARY -->

        <div class="cart-summary">

            <div class="summary-row">

                <span>
                    Subtotal
                </span>

                <strong id="cartSubtotal">
                    GHS 0.00
                </strong>

            </div>


            <div class="summary-row">

                <span>
                    Delivery
                </span>

                <strong id="cartDelivery">
                    GHS 0.00
                </strong>

            </div>


            <div class="summary-total">

                <span>
                    Total
                </span>

                <strong id="cartTotal">
                    GHS 0.00
                </strong>

            </div>


            <!-- DELIVERY -->

            <button
                type="button"
                id="deliveryButton"
                class="primary-btn">

                <i class="fa-solid fa-truck-fast"></i>

                Proceed to Delivery

            </button>


            <!-- PAYMENT -->

            <button
                type="button"
                id="payNowButton"
                class="pay-btn">

                <i class="fa-solid fa-credit-card"></i>

                Pay Now

            </button>


            <!-- RETURN TO SHOPPING -->

            <div class="continue-shopping">

                <a href="../catalogue/catalogue.html">

                    <i class="fa-solid fa-arrow-left"></i>

                    Continue Shopping

                </a>

            </div>

        </div>

    </div>

</main>


<!-- ==========================================================
     JAVASCRIPT
========================================================== -->

<script src="cart.js"></script>

</body>

</html>
